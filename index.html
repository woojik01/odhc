        .btn-primary { height: 48px; background: var(--btn-primary-bg); color: var(--btn-primary-text); border: 1px solid var(--btn-primary-bg); border-radius: 12px; font-weight: 700; font-size: 15px; padding: 0 20px; display:flex; align-items:center; justify-content:center; min-width:44px; transition: transform 0.1s, opacity 0.15s; }
